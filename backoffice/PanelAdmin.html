<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="stylesheet" href="./css/PanelAdmin.css">

<body>

    <div class="panel">

            <a href="./php/logoutAdmin.php" class="boton boton--cerrar"> 
                <svg class="boton__icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        //Esto es el "path" que sirve para dibujar el logo de cerrar sesion sin necesidad de una imagen
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-linecap="round" stroke-linejoin="round" />

            </div>


            <div class="panel__header-lado"></div>


        </div>


        <div id="mensaje" class="panel__mensaje"></div>

                        <th class="tabla-usuarios__celda tabla-usuarios__celda--accion">Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios">



                </tbody>
            </table>
